name: Pfft hourly catalog

on:
workflow_dispatch:
schedule:
- cron: '0 * * * *'

permissions:
contents: write

concurrency:
group: pfft-catalog
cancel-in-progress: false

jobs:
sync:
runs-on: ubuntu-latest
timeout-minutes: 10
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: '3.12'
- name: Collect public product details
shell: bash
run: |
python - <<'PYTHON'
import concurrent.futures
import html
import json
import re
import urllib.request
from datetime import datetime, timezone
from pathlib import Path

      SHOP = 'https://fruitsfamily.com/seller/3g5i/ktkjtj1523?sort=NEW'
      SELLER = '160902'
      OUTPUT = Path('site-data/products.json')
      
      
      def get_state(url):
          request = urllib.request.Request(url, headers={'User-Agent': 'PfftCatalogSync/1.0'})
          with urllib.request.urlopen(request, timeout=40) as response:
              page = response.read().decode('utf-8')
          match = re.search(r'<script id="__APOLLO_STATE__"[^>]*>(.*?)</script>', page, re.S)
          if not match:
              raise RuntimeError('상품 데이터 확인 실패. 기존 데이터 보존.')
          return json.loads(match[1]), page
      
      
      def collect():
          state, page = get_state(SHOP)
          seller = state.get('SellerNotMe:' + SELLER)
          if not seller or type(seller.get('productCount')) is not int:
              raise RuntimeError('상점과 전체 상품 수 확인 실패')
          refs = []
          for key, value in state['ROOT_QUERY'].items():
              if key.startswith('searchProducts(') and ('"sellerId":' + SELLER) in key:
                  refs.extend(value)
          listed = {state[ref['__ref']]['id']: state[ref['__ref']] for ref in refs}
          if len(listed) != seller['productCount']:
              raise RuntimeError('전체 상품 수와 수집 수가 다름. 페이지 추가 수집 필요. 기존 데이터 보존.')
          urls = {}
          for path in re.findall(r'href="(/product/[^"?#]+)"', page):
              urls[str(int(path.split('/')[2], 36))] = 'https://fruitsfamily.com' + html.unescape(path)
      
          def detail(product_id):
              url = urls[product_id]
              data, _ = get_state(url)
              product = data['ProductNotMine:' + product_id]
              if product.get('seller', {}).get('__ref') != 'SellerNotMe:' + SELLER:
                  raise RuntimeError('상품 소유 상점 불일치')
              if not product.get('is_visible'):
                  return None
              photos = product['resizedSmallImages']
              if not photos or not all(x.startswith('https://image.production.fruitsfamily.com/') for x in photos):
                  raise RuntimeError('상품 사진 확인 실패')
              if not isinstance(product['price'], (int, float)) or product['price'] < 0:
                  raise RuntimeError('가격 확인 실패')
              if product['status'] not in ('selling', 'sold'):
                  raise RuntimeError('새로운 판매 상태 확인 필요: ' + product['status'])
              result = {key: product[key] for key in (
                  'id', 'title', 'brand', 'price', 'status', 'category',
                  'sub_category', 'size', 'condition', 'createdAt')}
              if result['category'] == '치마':
                  result['category'] = '하의'
              result.update(url=url, image=photos[0], photos=photos, measures=[])
              notes = []
              for line in product.get('description', '').splitlines():
                  line = line.strip()
                  if not line or line == product['title']:
                      continue
                  if line.startswith('사이즈:'):
                      result['labelSize'] = line.split(':', 1)[1].strip()
                  elif line.startswith('컨디션:'):
                      result['grade'] = line.split(':', 1)[1].strip()
                  elif line.startswith('- ') and ':' in line:
                      result['measures'].append([x.strip() for x in line[2:].split(':', 1)])
                  else:
                      notes.append(line)
              result['notes'] = '\n'.join(notes)
              return result
      
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              products = [p for p in pool.map(detail, sorted(listed)) if p is not None]
          if not products:
              raise RuntimeError('빈 목록은 자동 반영 중단. 전체 숨김 여부 수동 확인 필요.')
          OUTPUT.parent.mkdir(exist_ok=True)
          payload = {'schemaVersion': 1, 'checkedAt': datetime.now(timezone.utc).isoformat(), 'products': products}
          temp = OUTPUT.with_suffix('.tmp')
          temp.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          temp.replace(OUTPUT)
          print('완료:', len(products), '개 상품')
      
      
      if __name__ == '__main__':
          collect()
      PYTHON
  - name: Publish catalog
    shell: bash
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add site-data/products.json
      if git diff --cached --quiet; then exit 0; fi
      git commit -m "Update Pfft product catalog"
      git pull --rebase origin main
      git push origin HEAD:main
